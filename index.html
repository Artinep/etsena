<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Etsena</title>
	<link rel="shortcut icon" type="image/png" href="/etsena/mada_cart_64x64.png">
	<meta name="description" content="This page contains a repository where you can download an Android app to buy products on AliExpress.">
	<meta name="keywords" content="shop">
	<meta name="author" content="Artinep">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover">
    <meta name="robots" content="index, follow">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data:; style-src 'self' 'sha256-FhSetcQykkIS+rpj+XirkLMvk6sAM/U00XR9HFmhpow='; object-src 'self'; child-src 'self';">
    <script src="./tsy_misy_bedy/jquery-3.7.1.min.js"></script>
    <style>html, body { margin: 0;padding: 0;outline: 0;left: 0;top: 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";overflow: hidden !important;width: 100% !important;height: 100% !important; } body { background-image:linear-gradient(#00000080,#00000080),url(./sary/mada_cart.png);background-position:center;background-repeat:no-repeat;background-size:cover;background-attachment:fixed;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color: #f2f2f2; } #title { position: absolute; width: 100px; height: 18px;top: 0;font-size: 12px;background-image: linear-gradient(rgba(14.4, 8.4, 8.4, 0.4) 0, rgba(0, 0, 0, 0.8) 100%);color: white;text-align: center;box-shadow: 1px 1px 5px gray;outline: 0; text-decoration: none;  transition: all .3s;font-family: Quicksand, Monaco, "Lucida Console", "Courier New", monospace; border-radius: 0px 0px 8px 8px;left: 50%;transform: translateX(-50%);-webkit-transform: translateX(-50%);-moz-transform: translateX(-50%);-ms-transform: translateX(-50%);-o-transform: translateX(-50%);z-index: 999;cursor: alias;line-height: 18px; } canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; border: none; outline: none; overflow: hidden; }</style>
</head>
<body>
	<div id="title">Etsena</div>
	<canvas id="thecanvas" tabindex="0"></canvas>
	<script type="module">

		'use strict';
		
		import * as THREE from './tsy_misy_bedy/three.module.min.js';
		import { OrbitControls } from './tsy_misy_bedy/OrbitControls.js';
		import { Water } from './tsy_misy_bedy/Water.js';
		import { Lensflare, LensflareElement } from './tsy_misy_bedy/Lensflare.js';
		import { OBJLoader } from './tsy_misy_bedy/OBJLoader.js';
		import { MTLLoader } from './tsy_misy_bedy/MTLLoader.js';

		window.runtimeEnableLeakVars = { stackLookupCount: 0, };
		const canvas = document.querySelector("#thecanvas"), loader = new THREE.TextureLoader(), clock = new THREE.Clock();
		canvas.width = window.innerWidth; canvas.height = window.innerHeight;
		let scene, camera, renderer, controls, gl, water, time;
		let deadEnd = false;

		window.onload = function() {
		    run();   
		}

		function initGraphics() {
			// RENDERER                 
		    renderer = new THREE.WebGLRenderer( { canvas: canvas, context: gl, antialias: true, } );
		    renderer.setPixelRatio( window.devicePixelRatio/2 );
		    renderer.setSize( window.innerWidth, window.innerHeight );           
		    renderer.shadowMap.enabled = true;
		    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

		    // CAMERA
		    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 700);
		    camera.position.set(78,160,-50);
		    //camera.lookAt(new THREE.Vector3(0, 2, -2));

		    // SCENE
		    scene = new THREE.Scene();
		    scene.background = new THREE.Color().setHSL( 14.4, 8.4, 8.4 );
		    scene.fog = new THREE.FogExp2( scene.background, 0.0015 );
		    const texture = loader.load(
		        'sary/sky.png',
		    () => {
		        texture.mapping = THREE.EquirectangularReflectionMapping;
		        texture.colorSpace = THREE.SRGBColorSpace;
		        texture.minFilter = THREE.NearestFilter;
		        scene.background = texture;
		        texture.dispose();
		    });
		    scene.add( new THREE.AmbientLight( 0x666666, 3 ) );

		    // SUN ABOVE
		    const sunLight = new THREE.DirectionalLight(0xFFFFFF, 3);
		    sunLight.position.set( 2000, 500, 1000 );
		    sunLight.castShadow = true;
		    sunLight.name = 'sun_light';
		    sunLight.shadow.camera.left = - 5000;
		    sunLight.shadow.camera.right = 5000;
		    sunLight.shadow.camera.top = 5000;
		    sunLight.shadow.camera.bottom = - 5000;
		    sunLight.shadow.camera.far = 2000;
		    sunLight.shadow.bias = - 0.01;
		    sunLight.shadow.camera.updateProjectionMatrix();
		    scene.add(sunLight);

		    // WATER
		    const waterGeometry = new THREE.PlaneGeometry( 20480, 20480 );
		    water = new Water(
		        waterGeometry,
		        {
		            textureWidth: 512,
		            textureHeight: 512,
		            waterNormals: new THREE.TextureLoader().load( 'sary/water.jpg', function ( texture ) {
		                texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
		            } ),
		            sunDirection: new THREE.Vector3(),
		            sunColor: 0xffffff,
		            waterColor: 0x001e0f,
		            distortionScale: 3.7,
		            fog: scene.fog !== undefined
		        }
		    );
		    water.rotation.x = - Math.PI / 2; water.position.y = .2;
		    const sun = new THREE.Vector3( 2000, 500, 1000 );
		    water.material.uniforms[ 'sunDirection' ].value.copy( sun ).normalize();
		    water.material.dispose();water.geometry.dispose();
		    scene.add( water );

		    // HEMISPHERE LIGHT
		    const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 0.6 );
		    hemiLight.position.set( 0, 100, 0 );
		    scene.add( hemiLight );

		    // LENSFLARE
		    const textureFlare0 = loader.load( 'sary/lensflare0.png' );
		    const textureFlare3 = loader.load( 'sary/lensflare3.png' );
		    addLight( 0.55, 0.9, 0.5, 2000, 0,  1000 );
		    addLight( 0.08, 0.8, 0.5, 1000, 100, 500 );
		    addLight( 0.995, 0.5, 0.9, 2000, 2000,  1000 );
		    function addLight( h, s, l, x, y, z ) {                
		        const light = new THREE.PointLight( 0xffffff, 1, 2000, 0 );
		        light.color.setHSL( h, s, l );
		        light.position.set( x, y, z );
		        light.castShadow = false;
		        scene.add( light );
		        const lensflare = new Lensflare();
		        lensflare.addElement( new LensflareElement( textureFlare0, 700, 0, light.color ) );
		        lensflare.addElement( new LensflareElement( textureFlare3, 60, 0.6 ) );
		        lensflare.addElement( new LensflareElement( textureFlare3, 70, 0.7 ) );
		        lensflare.addElement( new LensflareElement( textureFlare3, 120, 0.9 ) );
		        lensflare.addElement( new LensflareElement( textureFlare3, 70, 1 ) );
		        light.add( lensflare );
		    }
		    textureFlare0.dispose();textureFlare3.dispose();

		    // CONTROLS
		    controls = new OrbitControls( camera, renderer.domElement );
		    controls.enablePan = false;
		    controls.enableZoom = false;
		    //controls.maxTargetRadius = .5;
		    //control.target.set(0, 2, -2);
		    //control.center.set(0, 2, 0);
		    //controls.target.copy( avatar.position );
		    controls.update();

		    window.addEventListener('resize', onWindowResize, false);

		}

		function ahetsika() {
			requestAnimationFrame( ahetsika );

			// Don't go below 30 Hz to prevent spiral of death
		    let deltaTime = clock.getDelta();
		    deltaTime = Math.min(deltaTime, 1.0 / 60.0);

		    time += deltaTime;

		    water.material.uniforms[ 'time' ].value += deltaTime;

		    controls.update( deltaTime );

		    renderer.render( scene, camera );
		}

		function onWindowResize() {
		    camera.aspect = window.innerWidth / window.innerHeight;
		    camera.updateProjectionMatrix();
		    renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function run() {
			etsena.isWebGLAvailable();
			etsena.isWebDrived();
			etsena.isCompatible();

			initGraphics();
			ahetsika();
		}

		const etsena = {
			isWebGLAvailable: () => {
				try {
					gl = canvas.getContext( 'webgl2' );
				} catch ( e1 ) {
					try {
						gl = canvas.getContext( 'webgl' );
					} catch ( e2 ) {
						try {
							gl = canvas.getContext('experimental-webgl');
						} catch ( e3 ) {
							throw new Error( e3 );
							deadEnd = true;
							alert("Something is not quite right ! Please update your browser !");
						}
					}
				}
			},
			isWebDrived: () => {
		        if ( navigator.webdriver === true ) {
		            window.location.replace("https://www.google.com");throw new Error('Error!');
		            deadEnd = true;
		        } else if ( typeof navigator.webdriver === 'undefined' ) {
		            window.location.replace("https://www.google.com");throw new Error('Error!');
		            deadEnd = true;
		        } else if ( Object.getOwnPropertyNames(navigator).length !== 0 ) {
		            window.location.replace("https://www.google.com");throw new Error('Error!');
		            deadEnd = true;
		        } else if ( Object.getOwnPropertyDescriptor( navigator, 'webdriver' ) !== undefined ) {
		            window.location.replace("https://www.google.com");throw new Error('Error!');
		            deadEnd = true;
		        }
		    },
		    isCompatible: () => {
		        if ("WebAssembly" in window && typeof WebAssembly === "object" && typeof WebAssembly.instantiate === "function") {
		        	console.info('Wasm compatibility test: OK!');
		        } else {
		        	console.info('Sorry ! WebAssembly is not supported !');
		        	throw new Error('Error!');
		        }
		    },
		}		

		window.onerror = function myErrorHandler(errorMsg, url, lineNumber) {
		    return true; // false : rehefa tena alefa
		}

		void 0;

	</script>
</body>
</html>
